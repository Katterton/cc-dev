modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''
Connect VSCode to CC:Tweaked computers and turtles. Mirror terminals, edit files with Copilot, and control your computers remotely.
'''

# Require NeoForge
[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

# Require Minecraft
[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Require CC:Tweaked
[[dependencies.${mod_id}]]
    modId="computercraft"
    type="required"
    versionRange="[1.113.0,)"
    ordering="AFTER"
    side="BOTH"
